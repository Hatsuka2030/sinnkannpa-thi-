<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>パーカッション 運搬チェックリスト</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg: #ffffff;
    --surface: #f8f8f8;
    --border: #e8e8e8;
    --border-strong: #d0d0d0;
    --text: #1a1a1a;
    --text-muted: #888;
    --accent-go: #2563eb;
    --accent-go-light: #eff6ff;
    --accent-return: #16a34a;
    --accent-return-light: #f0fdf4;
    --check1: #f59e0b;
    --check2: #8b5cf6;
    --direct: #ef4444;
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 40px;
  }

  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px 0;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .app-title { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }

  .sync-status {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .sync-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #ccc;
    transition: background 0.3s;
  }
  .sync-dot.synced { background: #22c55e; }
  .sync-dot.syncing { background: #f59e0b; animation: pulse 1s infinite; }
  .sync-dot.error { background: #ef4444; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .tabs { display: flex; }
  .tab {
    flex: 1;
    padding: 10px 8px;
    border: none;
    background: none;
    cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .tab.active-go { color: var(--accent-go); border-bottom-color: var(--accent-go); }
  .tab.active-return { color: var(--accent-return); border-bottom-color: var(--accent-return); }

  .trip-selector {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .trip-btn {
    flex: 1;
    padding: 8px;
    border: 1.5px solid var(--border-strong);
    border-radius: var(--radius);
    background: var(--bg);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--text-muted);
  }
  .trip-btn.active-go { background: var(--accent-go-light); border-color: var(--accent-go); color: var(--accent-go); }
  .trip-btn.active-return { background: var(--accent-return-light); border-color: var(--accent-return); color: var(--accent-return); }

  .progress-wrap {
    padding: 10px 16px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 5px;
    font-family: 'DM Mono', monospace;
  }
  .progress-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 2px; transition: width 0.4s ease; }

  .legend {
    display: flex;
    gap: 12px;
    padding: 8px 16px;
    font-size: 10px;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; }

  .list { padding: 8px 16px; }

  .section-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 14px 0 6px;
  }

  .section-label.trip1 { color: var(--check1); }
  .section-label.trip2 { color: var(--check2); }

  .item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 12px;
    margin-bottom: 4px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg);
    transition: all 0.15s;
  }
  .item:hover { background: var(--surface); }
  .item.direct-checked { background: #fff7f7; border-color: #fca5a5; }

  .item-rank {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    width: 20px;
    flex-shrink: 0;
    text-align: right;
  }
  .item-name { flex: 1; font-size: 13px; line-height: 1.4; }
  .item-name.crossed { text-decoration: line-through; color: var(--text-muted); }

  .checks { display: flex; gap: 6px; flex-shrink: 0; }
  .check-wrap { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .check-label { font-size: 9px; color: var(--text-muted); font-family: 'DM Mono', monospace; }

  input[type="checkbox"] {
    appearance: none;
    width: 22px; height: 22px;
    border-radius: 5px;
    border: 1.5px solid var(--border-strong);
    cursor: pointer;
    position: relative;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  input[type="checkbox"]:checked::after {
    content: '✓';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 13px;
    font-weight: 700;
  }
  .cb-1:checked { background: var(--check1); border-color: var(--check1); }
  .cb-1:checked::after { color: white; }
  .cb-2:checked { background: var(--check2); border-color: var(--check2); }
  .cb-2:checked::after { color: white; }
  .cb-direct { border-color: #fca5a5; background: #fff7f7; cursor: not-allowed; }
  .cb-direct:checked { background: var(--direct); border-color: var(--direct); }
  .cb-direct:checked::after { color: white; }

  .reset-wrap { padding: 20px 16px 0; text-align: center; }
  .reset-btn {
    padding: 8px 20px;
    border: 1.5px solid var(--border-strong);
    border-radius: 20px;
    background: var(--bg);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 12px;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s;
  }
  .reset-btn:hover { border-color: var(--direct); color: var(--direct); }

  @media (max-width: 400px) {
    .item-name { font-size: 12px; }
    .item { padding: 9px 10px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="app-title">🥁 運搬チェックリスト</div>
    <div class="sync-status">
      <div class="sync-dot" id="syncDot"></div>
      <span id="syncLabel">接続中…</span>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active-go" id="tabGo" onclick="switchPage('go')">🚗 行き</button>
    <button class="tab" id="tabReturn" onclick="switchPage('return')">🏠 帰り</button>
  </div>
</div>

<div class="trip-selector">
  <button class="trip-btn active-go" id="trip1Btn" onclick="switchTrip(1)">1回目</button>
  <button class="trip-btn" id="trip2Btn" onclick="switchTrip(2)">2回目</button>
</div>

<div class="progress-wrap">
  <div class="progress-label">
    <span id="progressText">0 / 0 完了</span>
    <span id="progressPct">0%</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:var(--check1)"></div>1回目</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--check2)"></div>2回目</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--direct)"></div>積んだか（自動）</div>
</div>

<div class="list" id="listContainer"></div>

<div class="reset-wrap">
  <button class="reset-btn" onclick="confirmReset()">現在のページをリセット</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const isViewMode = new URLSearchParams(window.location.search).get('view') === 'true';

const firebaseConfig = {
  apiKey: "AIzaSyDBIqNXbrT26JWpN-9m6sVcpGwQO7sa3UE",
  authDomain: "sinnkannpa-thi.firebaseapp.com",
  databaseURL: "https://sinnkannpa-thi-default-rtdb.firebaseio.com",
  projectId: "sinnkannpa-thi",
  storageBucket: "sinnkannpa-thi.firebasestorage.app",
  messagingSenderId: "594486072027",
  appId: "1:594486072027:web:f6c2f2a1e30052b5aeb2fe"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const ITEMS_GO = [
  // --- 1回目予定 ---
  { rank: 1,  name: 'スネア（＋脚）',                section: '🟡 1回目に運ぶ', trip: 1 },
  { rank: 2,  name: 'ライドシンバル',                section: '🟡 1回目に運ぶ', trip: 1 },
  { rank: 3,  name: 'クラッシュシンバル',             section: '🟡 1回目に運ぶ', trip: 1 },
  { rank: 4,  name: 'ハイハット',                    section: '🟡 1回目に運ぶ', trip: 1 },
  { rank: 5,  name: 'フロアタム',                    section: '🟡 1回目に運ぶ', trip: 1 },
  { rank: 6,  name: 'ハイタム',                      section: '🟡 1回目に運ぶ', trip: 1 },
  { rank: 7,  name: 'ロータム',                      section: '🟡 1回目に運ぶ', trip: 1 },
  { rank: 8,  name: 'ベーデー（＋ペダル、毛布）',    section: '🟡 1回目に運ぶ', trip: 1 },
  { rank: 9,  name: 'キーボード大（＋スタンド）',     section: '🟡 1回目に運ぶ', trip: 1 },
  { rank: 10, name: 'キーボード小（＋スタンド）',     section: '🟡 1回目に運ぶ', trip: 1 },
  { rank: 11, name: 'アンプ',                        section: '🟡 1回目に運ぶ', trip: 1 },
  { rank: 12, name: '延長コード',                    section: '🟡 1回目に運ぶ', trip: 1 },
  { rank: 13, name: '合わせシンバル（＋スタンド）',   section: '🟡 1回目に運ぶ', trip: 1 },
  { rank: 14, name: 'ウィンドチャイム（＋スタンド）', section: '🟡 1回目に運ぶ', trip: 1 },
  { rank: 15, name: '譜面台（部所有）',               section: '🟡 1回目に運ぶ', trip: 1 },
  { rank: 16, name: '譜面隠し',                       section: '🟡 1回目に運ぶ', trip: 1 },
  // --- 2回目予定 ---
  { rank: 17, name: 'ドラムマット',                  section: '🟣 2回目に運ぶ', trip: 2 },
  { rank: 18, name: 'ドラムの椅子',                  section: '🟣 2回目に運ぶ', trip: 2 },
  { rank: 19, name: 'シロフォン',                    section: '🟣 2回目に運ぶ', trip: 2 },
  { rank: 20, name: 'グロッケン（＋スタンド）',       section: '🟣 2回目に運ぶ', trip: 2 },
  { rank: 21, name: 'ウッドブロック',                section: '🟣 2回目に運ぶ', trip: 2 },
  { rank: 22, name: 'アゴゴ',                        section: '🟣 2回目に運ぶ', trip: 2 },
  { rank: 23, name: 'トライアングル',                section: '🟣 2回目に運ぶ', trip: 2 },
  { rank: 24, name: 'タンバリン（皮付き）',           section: '🟣 2回目に運ぶ', trip: 2 },
  { rank: 25, name: 'スティックケース',              section: '🟣 2回目に運ぶ', trip: 2 },
  { rank: 26, name: 'コントラバス（緑）',             section: '🟣 2回目に運ぶ', trip: 2 },
  { rank: 27, name: 'コントラバス（茶）',             section: '🟣 2回目に運ぶ', trip: 2 },
  { rank: 28, name: 'コントラバス（黒）',             section: '🟣 2回目に運ぶ', trip: 2 },
];

const ITEMS_RETURN = [
  // --- コントラバス（帰りの1回目）---
  { rank: 26, name: 'コントラバス（緑）',             section: '🟡 1回目に運ぶ', trip: 1 },
  { rank: 27, name: 'コントラバス（茶）',             section: '🟡 1回目に運ぶ', trip: 1 },
  { rank: 28, name: 'コントラバス（黒）',             section: '🟡 1回目に運ぶ', trip: 1 },
  // --- 帰りの2回目（残り全部）---
  { rank: 17, name: 'ドラムマット',                  section: '🟣 2回目に運ぶ', trip: 2 },
  { rank: 18, name: 'ドラムの椅子',                  section: '🟣 2回目に運ぶ', trip: 2 },
  { rank: 19, name: 'シロフォン',                    section: '🟣 2回目に運ぶ', trip: 2 },
  { rank: 20, name: 'グロッケン（＋スタンド）',       section: '🟣 2回目に運ぶ', trip: 2 },
  { rank: 21, name: 'ウッドブロック',                section: '🟣 2回目に運ぶ', trip: 2 },
  { rank: 22, name: 'アゴゴ',                        section: '🟣 2回目に運ぶ', trip: 2 },
  { rank: 23, name: 'トライアングル',                section: '🟣 2回目に運ぶ', trip: 2 },
  { rank: 24, name: 'タンバリン（皮付き）',           section: '🟣 2回目に運ぶ', trip: 2 },
  { rank: 25, name: 'スティックケース',              section: '🟣 2回目に運ぶ', trip: 2 },
  { rank: 1,  name: 'スネア（＋脚）',                section: '🟣 2回目に運ぶ', trip: 2 },
  { rank: 2,  name: 'ライドシンバル',                section: '🟣 2回目に運ぶ', trip: 2 },
  { rank: 3,  name: 'クラッシュシンバル',             section: '🟣 2回目に運ぶ', trip: 2 },
  { rank: 4,  name: 'ハイハット',                    section: '🟣 2回目に運ぶ', trip: 2 },
  { rank: 5,  name: 'フロアタム',                    section: '🟣 2回目に運ぶ', trip: 2 },
  { rank: 6,  name: 'ハイタム',                      section: '🟣 2回目に運ぶ', trip: 2 },
  { rank: 7,  name: 'ロータム',                      section: '🟣 2回目に運ぶ', trip: 2 },
  { rank: 8,  name: 'ベーデー（＋ペダル、毛布）',    section: '🟣 2回目に運ぶ', trip: 2 },
  { rank: 9,  name: 'キーボード大（＋スタンド）',     section: '🟣 2回目に運ぶ', trip: 2 },
  { rank: 10, name: 'キーボード小（＋スタンド）',     section: '🟣 2回目に運ぶ', trip: 2 },
  { rank: 11, name: 'アンプ',                        section: '🟣 2回目に運ぶ', trip: 2 },
  { rank: 12, name: '延長コード',                    section: '🟣 2回目に運ぶ', trip: 2 },
  { rank: 13, name: '合わせシンバル（＋スタンド）',   section: '🟣 2回目に運ぶ', trip: 2 },
  { rank: 14, name: 'ウィンドチャイム（＋スタンド）', section: '🟣 2回目に運ぶ', trip: 2 },
  { rank: 15, name: '譜面台（部所有）',               section: '🟣 2回目に運ぶ', trip: 2 },
  { rank: 16, name: '譜面隠し',                       section: '🟣 2回目に運ぶ', trip: 2 },
];

let currentPage = 'go';
let currentTrip = 1;
let checks = { go: { 1: {}, 2: {} }, return: { 1: {}, 2: {} } };

function setSyncStatus(state, label) {
  document.getElementById('syncDot').className = 'sync-dot ' + state;
  document.getElementById('syncLabel').textContent = label;
}

const dbRef = ref(db, 'checks');
onValue(dbRef, (snapshot) => {
  const data = snapshot.val();
  if (data) {
    ['go','return'].forEach(p => {
      [1,2].forEach(t => {
        if (data[p] && data[p][t]) checks[p][t] = data[p][t];
      });
    });
  }
  setSyncStatus('synced', '同期済み');
  renderList();
}, () => setSyncStatus('error', 'エラー'));

let saveTimer = null;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    setSyncStatus('syncing', '保存中…');
    update(ref(db, 'checks'), checks)
      .then(() => setSyncStatus('synced', '同期済み'))
      .catch(() => setSyncStatus('error', 'エラー'));
  }, 600);
}

window.switchPage = function(page) {
  currentPage = page;
  document.getElementById('tabGo').className = 'tab' + (page === 'go' ? ' active-go' : '');
  document.getElementById('tabReturn').className = 'tab' + (page === 'return' ? ' active-return' : '');
  updateTripButtons();
  renderList();
};

window.switchTrip = function(trip) {
  currentTrip = trip;
  updateTripButtons();
  renderList();
};

function updateTripButtons() {
  const cls = currentPage === 'go' ? 'active-go' : 'active-return';
  document.getElementById('trip1Btn').className = 'trip-btn' + (currentTrip === 1 ? ' ' + cls : '');
  document.getElementById('trip2Btn').className = 'trip-btn' + (currentTrip === 2 ? ' ' + cls : '');
}

function renderList() {
  const items = currentPage === 'go' ? ITEMS_GO : ITEMS_RETURN;
  const container = document.getElementById('listContainer');
  container.innerHTML = '';
  let lastSection = '';

  items.forEach(item => {
    if (item.section !== lastSection) {
      const sec = document.createElement('div');
      const tripClass = item.trip === 1 ? 'trip1' : item.trip === 2 ? 'trip2' : '';
      sec.className = 'section-label ' + tripClass;
      sec.textContent = item.section;
      container.appendChild(sec);
      lastSection = item.section;
    }

    const c1 = checks[currentPage][1][item.rank] || false;
    const c2 = checks[currentPage][2][item.rank] || false;
    const isDirect = c1 || c2;

    const div = document.createElement('div');
    div.className = 'item' + (isDirect ? ' direct-checked' : '');
    div.id = `item-${item.rank}`;

    div.innerHTML = `
      <div class="item-rank">${item.rank}</div>
      <div class="item-name ${isDirect ? 'crossed' : ''}">${item.name}</div>
      <div class="checks">
        <div class="check-wrap">
          <span class="check-label">1回目</span>
          <input type="checkbox" class="cb-1" data-rank="${item.rank}" data-trip="1" ${c1 ? 'checked' : ''} ${isViewMode ? 'disabled' : ''}>
        </div>
        <div class="check-wrap">
          <span class="check-label">2回目</span>
          <input type="checkbox" class="cb-2" data-rank="${item.rank}" data-trip="2" ${c2 ? 'checked' : ''} ${isViewMode ? 'disabled' : ''}>
        </div>
        <div class="check-wrap">
          <span class="check-label">積んだか</span>
          <input type="checkbox" class="cb-direct" ${isDirect ? 'checked' : ''} disabled>
        </div>
      </div>
    `;
    container.appendChild(div);
  });

  container.querySelectorAll('input[type="checkbox"]:not(.cb-direct)').forEach(cb => {
    cb.addEventListener('change', onCheck);
  });

  updateProgress(items);
}

function onCheck(e) {
  if (isViewMode) { e.target.checked = !e.target.checked; return; }
  const rank = parseInt(e.target.dataset.rank);
  const trip = parseInt(e.target.dataset.trip);
  checks[currentPage][trip][rank] = e.target.checked;

  const c1 = checks[currentPage][1][rank] || false;
  const c2 = checks[currentPage][2][rank] || false;
  const isDirect = c1 || c2;

  const itemEl = document.getElementById(`item-${rank}`);
  if (itemEl) {
    itemEl.className = 'item' + (isDirect ? ' direct-checked' : '');
    itemEl.querySelector('.item-name').className = 'item-name' + (isDirect ? ' crossed' : '');
    itemEl.querySelector('.cb-direct').checked = isDirect;
  }

  const items = currentPage === 'go' ? ITEMS_GO : ITEMS_RETURN;
  updateProgress(items);
  scheduleSave();
}

function updateProgress(items) {
  let done = 0;
  items.forEach(item => {
    if (checks[currentPage][1][item.rank] || checks[currentPage][2][item.rank]) done++;
  });
  const total = items.length;
  const pct = Math.round(done / total * 100);
  document.getElementById('progressText').textContent = `${done} / ${total} 完了`;
  document.getElementById('progressPct').textContent = `${pct}%`;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressFill').style.background =
    currentPage === 'go' ? 'var(--accent-go)' : 'var(--accent-return)';
}

window.confirmReset = function() {
  if (!confirm(`「${currentPage === 'go' ? '行き' : '帰り'}」のチェックをすべてリセットしますか？`)) return;
  checks[currentPage] = { 1: {}, 2: {} };
  const items = currentPage === 'go' ? ITEMS_GO : ITEMS_RETURN;
  renderList();
  scheduleSave();
};
</script>
</body>
</html>
